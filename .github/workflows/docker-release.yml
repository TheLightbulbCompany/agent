name: Docker Release

# Builds the Isol8 patched OpenClaw base image (amd64 only — prod ECS Fargate is
# x86) on GitHub-hosted runners and publishes it to GHCR. Triggered by pushing a
# v* tag. amd64-only + a free-disk-space step so the heavy base build fits a
# standard ubuntu-latest runner (the org has no self-hosted/Blacksmith runners).

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Image version tag to publish (without leading v), e.g. 2026.6.1-isol8.1"
        required: true
        type: string

concurrency:
  group: docker-release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: isol8ai/agent

jobs:
  build-amd64:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - name: Free disk space
        run: |
          set -x
          sudo rm -rf /opt/hostedtoolcache /usr/local/lib/android /usr/share/dotnet \
            /opt/ghc /usr/local/.ghcup /usr/local/share/powershell /usr/share/swift \
            /usr/local/share/chromium /usr/local/lib/node_modules || true
          sudo docker image prune -af || true
          df -h /

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve version
        id: v
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push (amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.v.outputs.version }}
          provenance: false
          push: true
